type: dashboard
model: maintenances_flat
title: "Tableau de bord - Helia Etat Réseau"
timeseries: timestamp_debut
dimensions:
  - name: commune
    label: Commune
    column: commune
  - name: service
    label: Service
    column: service
  - name: impact
    label: Impact
    column: impact
  - name: est_active
    label: Est Active
    column: est_active
  - name: periode_jour_nuit
    label: Période (Jour/Nuit)
    column: periode_jour_nuit
  - name: province
    label: Province
    column: provinces_concernees # Note: This might be an array, Rill handles it if configured
measures:
  - name: total_maintenances
    label: Nombre de maintenances
    expression: count(distinct id)
  - name: total_communes
    label: Communes impactées
    expression: count(distinct commune)
  - name: avg_duree
    label: Durée moyenne (min)
    expression: avg(duree_fenetre_minutes)
