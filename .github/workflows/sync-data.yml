name: Sync Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Scrape et synchroniser les maintenances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Sync maintenances
        run: uv run --with helia-etat-reseaux python scripts/sync_data.py --data-dir data

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "data: sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
