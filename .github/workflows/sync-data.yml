name: Sync Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Scrape et synchroniser les maintenances
    runs-on: ubuntu-latest
    env:
      TZ: Pacific/Noumea
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Sync maintenances
        id: sync
        run: uv run python scripts/sync_data.py --data-dir data

      - name: Créer la PR et merger
        if: steps.sync.outputs.changed == 'true'
        id: pr
        env:
          PR_TITLE: ${{ steps.sync.outputs.pr_title }}
          PR_BODY: ${{ steps.sync.outputs.pr_body }}
        run: |
          BRANCH="sync/$(date +%Y%m%dT%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "$PR_TITLE"
          git push origin "$BRANCH"
          printf '%s' "$PR_BODY" > /tmp/pr_body.md
          PR_URL=$(gh pr create \
            --title "$PR_TITLE" \
            --body-file /tmp/pr_body.md \
            --base main \
            --head "$BRANCH")
          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
          echo "PR #$PR_NUMBER mergée."

      - name: Bumper la version SemVer
        if: steps.sync.outputs.changed == 'true'
        run: |
          git fetch origin main
          MERGE_SHA=$(git rev-parse origin/main)

          # Dernière version existante (défaut v0.0.0)
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          LATEST=${LATEST:-v0.0.0}
          MAJOR=$(echo "$LATEST" | cut -d. -f1 | tr -d 'v')
          MINOR=$(echo "$LATEST" | cut -d. -f2)
          PATCH=$(echo "$LATEST" | cut -d. -f3)

          # feat → MINOR bump ; chore → PATCH bump
          PR_TITLE="${{ steps.sync.outputs.pr_title }}"
          if [[ "$PR_TITLE" == feat* ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          git tag "$NEW_TAG" "$MERGE_SHA" -m "$PR_TITLE"
          git push origin "$NEW_TAG"
          echo "Tag $NEW_TAG créé sur $MERGE_SHA"

      - name: Aucun changement
        if: steps.sync.outputs.changed == 'false'
        run: echo "Aucun changement détecté."
