name: CI

on:
  pull_request_target:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build site Astro
    runs-on: ubuntu-latest
    env:
      TZ: Pacific/Noumea
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        working-directory: webapp
        run: bun install

      - name: Build
        working-directory: webapp
        run: bun run build
